<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment received | CloudFIXER</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/cloudfixer-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .payment-shell{max-width:760px;margin:7vh auto;padding:28px}
    .payment-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(26px,5vw,50px);box-shadow:0 20px 55px rgba(74,31,35,.08);text-align:center}
    .payment-card img{width:300px;max-width:78%;height:auto}.payment-card h1{color:var(--wine-dark);margin:.4rem 0 1rem}.payment-card p{color:#746a6c}
    .spinner{width:38px;height:38px;margin:24px auto;border:4px solid #eadfe0;border-top-color:var(--wine);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="payment-shell">
    <section class="payment-card">
      <a href="/"><img src="/cloudfixer-logo.svg" alt="CloudFIXER"></a>
      <div class="eyebrow">PAYMENT RECEIVED</div>
      <h1 id="title">Preparing your report…</h1>
      <div class="spinner" id="spinner"></div>
      <p id="status">We are securely confirming the payment. This usually takes only a few seconds.</p>
      <p><a href="/aws">Return to CloudFIXER</a></p>
    </section>
  </main>
<script>
(async()=>{
  const title=document.getElementById('title'),status=document.getElementById('status'),spinner=document.getElementById('spinner');
  const sessionId=new URLSearchParams(location.search).get('session_id');
  if(!sessionId){spinner.hidden=true;title.textContent='We could not identify this payment';status.textContent='Please use the link supplied by Stripe or contact CloudFIXER with your receipt.';return;}
  for(let attempt=0;attempt<8;attempt++){
    try{
      const response=await fetch('/api/order-status?session_id='+encodeURIComponent(sessionId),{cache:'no-store'});
      const data=await response.json();
      if(response.ok&&data.paid&&data.reportUrl){location.replace(data.reportUrl);return;}
      if(!response.ok&&response.status!==404) throw new Error(data.error||'Unable to confirm payment');
    }catch(error){
      if(attempt===7){spinner.hidden=true;title.textContent='Payment received';status.textContent='Your payment is safe, but the report is taking longer than expected. Refresh this page in a moment.';return;}
    }
    await new Promise(resolve=>setTimeout(resolve,1500));
  }
  spinner.hidden=true;title.textContent='Payment is still processing';status.textContent='Refresh this page shortly. Your report will unlock automatically when Stripe confirms the payment.';
})();
</script>
</body>
</html>
